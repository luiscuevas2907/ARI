<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Compra</title>

    <link rel="stylesheet" href="ANG.CSS">
</head>

<body>

    <div class="contenedor">

        <h1>Calculadora de Compra</h1>

        <label>Producto:</label>
        <input type="text" id="producto" placeholder="Ej. Teclado">

        <label>Precio:</label>
        <input type="number" id="precio" placeholder="Ej. 500">

        <label>Cantidad:</label>
        <input type="number" id="cantidad" placeholder="Ej. 2">

        <label>Descuento (%):</label>
        <input type="number" id="descuento" placeholder="Ej. 10">

        <button onclick="calcularCompra()">Calcular compra</button>

        <div class="resultado" id="resultado">
            <p>El resultado aparecerá aquí</p>
        </div>

    </div>

    <script src="ANG.JS"></script>

</body>
</html>
