<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>




    
  

    <h1>Mi Primer Formulario</h1>

    <h2>Registro</h2>

    <fieldset>
        <legend>Datos Personales</legend>

        Nombre:<br>
        <input type="text" name="nombre" class="caja-curva input-con-padding">
        <br><br>

        Dirección:<br>
        <input type="text" name="direccion" class="caja-curva input-con-padding">
        <br><br>

        Estatura:<br>
        <input 
            type="number"
            id="estatura"
            class="caja-curva input-con-padding"
            step="0.01"
            placeholder="Ej. 1.75">
        <br><br>

        Peso:<br>
        <input 
            type="number"
            id="peso"
            class="caja-curva input-con-padding"
            step="0.01"
            placeholder="Ej. 70">
        <br><br>

        <button 
            type="button"
            class="btn-profecional"
            onclick="calcularIMC()">
            Enviar
        </button>

        <p id="resultado"></p>

    </fieldset>

    <p>es un texto toma un color</p>

    <script src="index.js"></script>

</body>

</html>
